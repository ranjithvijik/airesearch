<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Ecosystem Game Theory — Interactive Dashboard</title>
<style>
:root{--ink:#1B2A3A;--mut:#5D6D7E;--line:#DDE3E8;--bg:#EEF1F4;--card:#FFFFFF;--acc:#0072B2;--acc2:#009E73;--rad:12px;--fs-xs:11px;--fs-sm:12px;--fs-md:13px;--fs-base:14px;--fs-h4:14px;--fs-h3:16px;--fs-h1:24px;--fs-kpi:30px;--f-ui:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;--f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
*{box-sizing:border-box}body{font-family:"Inter","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;margin:0;background:linear-gradient(180deg,#E8EDF1 0%,var(--bg) 240px);color:var(--ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
th[data-k]{cursor:pointer}th[data-k]:focus-visible{outline:2px solid var(--acc);outline-offset:-2px}
header{background:linear-gradient(120deg,#1B2A3A 0%,#243B55 60%,#14425F 100%);color:#fff;padding:22px 26px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
header h1{margin:0;font-size:var(--fs-h1);font-weight:800;letter-spacing:-.3px}header p{margin:6px 0 0;font-size:var(--fs-sm);color:#B0BEC9}
nav{display:flex;flex-wrap:wrap;gap:4px;background:#22303F;padding:8px 14px;position:sticky;top:0;z-index:5;box-shadow:0 1px 6px rgba(0,0,0,.2)}
nav button{background:none;border:0;color:#CBD4DC;padding:9px 14px;font-size:13px;cursor:pointer;border-radius:8px;transition:background .15s,color .15s}
nav button:hover{background:rgba(255,255,255,.1);color:#fff}
nav button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.25)}
main{padding:20px 24px;max-width:1320px;margin:0 auto}
.tab{display:none}.tab.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(430px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px 18px;box-shadow:0 2px 8px rgba(27,42,58,.07)}
.card h3{margin:0 0 10px;font-size:var(--fs-h3);font-weight:700;letter-spacing:.1px;display:flex;align-items:center;gap:8px}.card h3 small{color:var(--mut);font-weight:400;font-size:var(--fs-sm)}
.card h3 .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));flex:none}
.kpi{font-size:var(--fs-kpi);font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums}.kpi small{font-size:var(--fs-sm);color:var(--mut);font-weight:400}
.kpi-sub{font-size:var(--fs-sm);color:var(--mut);margin-top:3px}
.sec-desc{color:var(--mut);font-size:var(--fs-base);margin:0 0 14px;max-width:900px}
.insight{background:linear-gradient(90deg,#E8F4FD,#E9F7F1);border-left:4px solid var(--acc);border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 14px;font-size:var(--fs-base)}
.insight b{color:var(--ink)}
details.xpl{margin-top:10px;font-size:var(--fs-md);color:var(--mut)}
details.xpl summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:var(--fs-md)}
details.xpl summary:hover{text-decoration:underline}
details.xpl div{margin-top:6px;line-height:1.55}
svg rect{transition:opacity .15s}svg rect:hover{opacity:.82}
svg path{transition:opacity .15s}svg path:hover{opacity:.85}
#tip{position:fixed;pointer-events:none;background:#1B2A3A;color:#fff;font-size:var(--fs-sm);padding:6px 10px;border-radius:6px;display:none;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap}
#modal{position:fixed;inset:0;background:rgba(15,25,35,.85);display:none;align-items:center;justify-content:center;z-index:40;padding:24px}
#modal.on{display:flex}#modal img{max-width:94vw;max-height:88vh;background:#fff;border-radius:8px}
#modal .cap{color:#D6DBDF;text-align:center;margin-top:8px;font-size:var(--fs-md)}
.dl{float:right;font-size:var(--fs-sm);color:var(--acc);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0}
table.dt thead th{position:sticky;top:0}table.dt tbody tr{transition:background .12s}table.dt tbody tr:hover{background:#E4F0F8 !important}
table.dt{border-collapse:collapse;width:100%;font-size:var(--fs-base);font-variant-numeric:tabular-nums}table.dt th,table.dt td{border:1px solid var(--line);padding:7px 10px;text-align:left}
table.dt th{background:#E7ECEF;cursor:pointer;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:#44566A}table.dt th:hover{background:#D6DEE4}
table.dt tr:nth-child(even){background:#F8F9F9}.num{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.3px;color:#fff}
.mono{font-family:var(--f-mono);font-size:.92em}
svg text{letter-spacing:.1px}
@media print{nav,#tip,#modal,.dl{display:none !important}body{background:#fff}main{max-width:none}.card{box-shadow:none;break-inside:avoid}.tab{display:block !important}}
.b-ok{background:#009E73}.b-warn{background:#E69F00}.b-bad{background:#D55E00}.b-info{background:#0072B2}
select,input[type=text]{font-size:13px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;margin:0 8px 10px 0}
.btnrow{margin:2px 0 12px}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
svg text{font-family:inherit}.ax{stroke:#5D6D7E;stroke-width:1}.gl{stroke:#EAEDED;stroke-width:1}
.foot{color:var(--mut);font-size:var(--fs-sm);margin:22px 0 30px}
.mgrid{display:grid;grid-template-columns:130px 1fr 130px;gap:6px;align-items:center;margin:8px 0}
.mgrid .rlab{font-size:var(--fs-sm);text-align:right;color:var(--mut)}.mgrid .clab{font-size:var(--fs-sm);color:var(--mut)}
.cell{border-radius:6px;padding:10px 6px;text-align:center;color:#fff;font-size:12px;font-weight:bold;border:1px solid rgba(27,42,58,.22);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.ne{outline:3px solid #F39C12;outline-offset:-3px}
.legend{font-size:12px;color:var(--mut)}.figgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.figgrid figure{margin:0;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px}
.figgrid img{width:100%;height:auto;display:block;background:#fff}.figgrid figcaption{font-size:var(--fs-sm);font-weight:600;color:var(--ink);padding:8px 2px 2px}
a{color:var(--acc)}
.lgnd{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 2px 2px;font-size:12px;color:var(--mut)}
.lgnd i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.stage-strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin-bottom:6px}
.stage-chip{flex:0 0 auto;max-width:230px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mut);cursor:pointer}
.stage-chip b{display:block;color:var(--ink);font-size:var(--fs-md)}.stage-chip.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(0,114,178,.25)}
.mchip{display:inline-block;background:#EEF1F4;border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin:2px 4px 2px 0;font-size:var(--fs-sm)}
.mchip.mono{color:#243B55}.stage-badge{display:inline-block;background:#243B55;color:#fff;border-radius:8px;font-size:var(--fs-xs);padding:2px 8px;margin-left:8px;vertical-align:middle}
.tourbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#1B2A3A;color:#fff;border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:var(--fs-base)}
.tourbar button{background:#fff;border:0;border-radius:6px;padding:6px 14px;font-size:var(--fs-md);font-weight:700;cursor:pointer;color:#1B2A3A}
.tourbar button:disabled{opacity:.4;cursor:default}.tourbar .pos{font-variant-numeric:tabular-nums;color:#B0BEC9}
.tour-on{outline:3px solid #0072B2 !important;outline-offset:2px;box-shadow:0 4px 18px rgba(0,114,178,.3)}
.repnav{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.repnav button{background:#fff;border:1px solid var(--line);border-radius:16px;padding:5px 13px;font-size:var(--fs-md);cursor:pointer;color:var(--ink)}
.repnav button:hover{border-color:var(--acc);color:var(--acc)}
.repsec h4{margin:16px 0 6px;font-size:var(--fs-h4);color:#243B55}.repsec p{margin:6px 0;font-size:var(--fs-base);max-width:960px}
.viewbtn{background:none;border:0;color:var(--acc);cursor:pointer;text-decoration:underline;font-size:12px;padding:0}
details.mod{margin:8px 0;border:1px solid var(--line);border-radius:8px;background:#fff}
details.mod summary{cursor:pointer;padding:9px 13px;font-size:13px;font-weight:600;list-style:none}
details.mod summary::-webkit-details-marker{display:none}
details.mod summary:hover{color:var(--acc)}details.mod .body{padding:0 13px 12px}
</style></head>

MPORTS & CONFIGURATION", "2. GLOBAL CONSTANTS & SETTINGS", "2. DATA LAYER -- embedded datasets, market-data access, validation reports.", "3. FIGURE-STYLE UTILITIES -- shared matplotlib styling used by the visualization engine (section 10).", "4. DATA VALIDATION & GLOBAL DWL INITIALIZATION", "4. LITERATURE & POLICY DIAGNOSTICS -- elasticity bounds, policy ranges, literature screens.", "5. MARKET STRUCTURE & NETWORK ANALYSIS -- concentration, market power, dependency risk.", "6. CORE GAME-THEORETIC ENGINE -- validation, equilibrium, simulation, welfare, robustness.", "7. PROJECTION, RISK & COOPERATIVE MODULES -- revenues, portfolio risk, stability, Shapley.", "8. RESULTS TABLE EXPORTERS -- one method per table (8.1-8.6: robustness battery + validated inputs).", "9. 2x2 GAME FRAMEWORK -- payoff construction, Nash solver, game taxonomy.", "10. VALUATION & VISUALIZATION -- financials, metrics, figure engine, valuation capstone.", "11. CIRCULAR-DEAL ANALYSIS -- round-tripping investment exposure.", "8. TEST FRAMEWORK & CLI HANDLER", "12. VERIFICATION & ENTRY POINT -- embedded smoke gate and main() run_pipeline."], "modules": [{"stage": "2. DATA LAYER -- embedded datasets, market-data access, validation reports.", "name": "EmbeddedDataSource", "doc": "Canonical embedded datasets -- the single source of truth for the analysis. Holds the curated AI-ecosystem sample (players, revenue snapshots, dependency edges, market metadata and baseline strategic payoffs) in code so the run_pipeline runs offline and reproduces exactly. Accessors: get_industry_players() per-player attributes (revenues, categories, roles). get_industry_dependencies() directed dependency edges between players. get_market_metadata() market-level parameters (size, growth, elasticities). get_strategic_payoffs() baseline 2x2 payoff matrices per game. Structural integrity is checked at startup by run_data_self_test().", "methods": ["get_industry_players", "get_industry_dependencies", "get_market_metadata", "get_strategic_payoffs"]}, {"stage": "4. DATA VALIDATION & GLOBAL DWL INITIALIZATION", "name": "MarketDataSource", "doc": "Live market-data source backed by SEC EDGAR, with graceful offline fallback. _fetch_sec_revenue_ttm() pulls trailing-twelve-month revenue for covered filers; when the network or a filing is unavailable the run_pipeline falls back to the embedded snapshot so results stay reproducible. get_industry_players() and get_industry_dependencies() mirror the EmbeddedDataSource interface so callers can swap sources without changing downstream code.", "methods": ["get_industry_players", "get_industry_dependencies"]}, {"stage": "4. LITERATURE & POLICY DIAGNOSTICS -- elasticity bounds, policy ranges, literature screens.", "name": "DependencyEnhancer", "doc": "Enriches raw dependency edges with category mappings for downstream analysis. create_enhanced_files() joins each dependency edge to sender/receiver categories (chip, cloud, model, application layers) and writes the enhanced edge list consumed by the network-risk (section 5) and payoff-construction (section 9) stages.", "methods": ["create_enhanced_files"]}, {"stage": "4. LITERATURE & POLICY DIAGNOSTICS -- elasticity bounds, policy ranges, literature screens.", "name": "ElasticitySensitivityAnalyzer", "doc": "Market-power bounds from literature elasticity ranges (Lerner rule). calculate_lerner_ranges() maps each literature demand-elasticity estimate to a Lerner index L = -1/epsilon, yielding an interval (not a point) for the price-cost margin. Intervals propagate into the market-power tables so the analysis reports defensible bounds rather than spurious precision.", "methods": ["calculate_lerner_ranges"]}, {"stage": "4. LITERATURE & POLICY DIAGNOSTICS -- elasticity bounds, policy ranges, literature screens.", "name": "PolicyInterventionAnalyzer", "doc": "Ex-ante policy scenarios with explicit uncertainty bounds. calculate_policy_ranges() scores interventions (e.g. interoperability mandates, compute-access rules) on effectiveness versus implementation cost, each as a low-central-high triple. Ranges feed the policy simulation figure and keep welfare claims conditioned on stated assumptions.", "methods": ["calculate_policy_ranges"]}, {"stage": "4. LITERATURE & POLICY DIAGNOSTICS -- elasticity bounds, policy ranges, literature screens.", "name": "LiteratureDiagnostics", "doc": "Structural diagnostics motivated by the 2025-2026 literature review. Each diagnostic operationalizes one literature stream using measured quantities only (no external parameters); the mapping is documented per method. All methods are total-safe: empty or malformed inputs yield empty frames instead of raising. run_all() writes one CSV per diagnostic (table_7.x) and returns the frames.", "methods": ["concentration_decomposition", "gatekeeper_index", "contestability_screen", "stability_screen", "fragility_composite", "policy_synergy", "five_pillar_screen", "equilibrium_audit", "mc_convergence", "run_all"]}, {"stage": "5. MARKET STRUCTURE & NETWORK ANALYSIS -- concentration, market power, dependency risk.", "name": "NetworkRiskAnalysis", "doc": "Dependency-graph risk: who is central, who is exposed, where contagion starts. Builds a directed graph from the enhanced edge list and reports analyze_centrality() (degree/betweenness/eigenvector), calculate_vulnerability_scores() (single-point-of-failure exposure per player) and get_critical_paths() (dependency chains whose disruption cascades). Results feed Table A1 and the network-risk appendix figure.", "methods": ["analyze_centrality", "calculate_vulnerability_scores", "get_critical_paths"]}, {"stage": "5. MARKET STRUCTURE & NETWORK ANALYSIS -- concentration, market power, dependency risk.", "name": "MarketStructureAnalyzer", "doc": "Concentration and market-power measurement from data, not assumptions. calculate_market_concentration() reports HHI plus HHI bands and a Gini coefficient on revenue shares; calculate_market_power() derives demand elasticities from observed margins (_derive_demand_elasticities) and converts them to Lerner indices with plain-English interpretations (_interpret_market_power). All inputs are measured revenues -- no calibrated demand system is smuggled in.", "methods": ["calculate_market_concentration", "calculate_market_power"]}, {"stage": "6. CORE GAME-THEORETIC ENGINE -- validation, equilibrium, simulation, welfare, robustness.", "name": "DataValidator", "doc": "Gatekeeper for input integrity (ECON 606 compliance plus structural sanity). validate_market_data() checks the player/dependency frames (required columns, non-negative revenues, shares summing to one, well-formed edges). validate_payoff_matrix() checks each 2x2 game (finite numeric entries, correct shape, no degenerate all-equal rows). Failures raise before any analysis runs, so a data typo can never silently become a published result.", "methods": ["validate_market_data", "validate_payoff_matrix"]}, {"stage": "6. CORE GAME-THEORETIC ENGINE -- validation, equilibrium, simulation, welfare, robustness.", "name": "CoordinationFailureAnalyzer", "doc": "Detects coordination failures: pure-strategy Nash outcomes that are not Pareto optimal. identify_coordination_failures() compares each game's Nash profile against the Pareto frontier; _classify_failure_severity() grades the welfare gap as negligible / moderate / severe. Flags feed the equilibrium-audit table and the welfare decomposition's coordination-failure component.", "methods": ["identify_coordination_failures"]}, {"stage": "6. CORE GAME-THEORETIC ENGINE -- validation, equilibrium, simulation, welfare, robustness.", "name": "MonteCarloSimulator", "doc": "Payoff-perturbation Monte Carlo for equilibrium robustness. run_monte_carlo_analysis() re-solves every game under Gaussian payoff noise (_perturb_matrix, seeded via make_rng), tracking how often the Nash profile survives (_simulate_interaction) with live progress (_print_progress) and a closing summary (_print_monte_carlo_summary). The draw history doubles as the input to the Geweke stationarity check (R1) in the robustness battery.", "methods": ["run_monte_carlo_analysis"]}, {"stage": "6. CORE GAME-THEORETIC ENGINE -- validation, equilibrium, simulation, welfare, robustness.", "name": "WelfareEconomicsAnalyzer", "doc": "Aggregate welfare accounting with a five-component deadweight-loss split. calculate_aggregate_welfare_loss() totals DWL across games; _decompose_dwl() splits it into coordination-failure, monopoly-pricing, innovation-distortion, quality-degradation and switching-cost components (one helper each), so the analysis can name the economic mechanism behind every welfare dollar.", "methods": ["calculate_aggregate_welfare_loss"]}, {"stage": "6. CORE GAME-THEORETIC ENGINE -- validation, equilibrium, simulation, welfare, robustness.", "name": "SensitivityAnalysis", "doc": "One-way sensitivity over the core aggregate-DWL% assumption. run_sensitivity_analysis() sweeps the headline DWL parameter across its plausible interval and records which conclusions move and which stand still; output feeds the tornado diagram.", "methods": ["run_sensitivity_analysis"]}, {"stage": "6. CORE GAME-THEORETIC ENGINE -- validation, equilibrium, simulation, welfare, robustness.", "name": "RobustnessBattery", "doc": "Formal robustness checks over and above point estimates. R1 stationarity (Geweke z): first-10% vs last-50% window means of each game's Monte-Carlo DWL draws; H0 = stationary chain. Two-sided normal p-value; |z| < 1.96 passes, with a Holm step-down correction across the six simultaneous per-game tests (Holm_verdict is binding). R2 multi-seed replicability: full-n reruns at GLOBAL_SEED+1/+2; per-game mean drift measured in pooled-SE units; drift > 3 SE fails. R3 noise-level robustness: perturbation sigma in {2.5%, 5%, 10%} at reduced n; verdict = Spearman rank preservation of game-mean DWLs. R4 Saltelli variance decomposition: real Jansen/Saltelli estimators with bootstrap 95% CIs on true mode", "methods": ["run_stationarity", "run_multiseed", "run_noise_robustness", "run_saltelli", "assumption_register", "run_all"]}, {"stage": "7. PROJECTION, RISK & COOPERATIVE MODULES -- revenues, portfolio risk, stability, Shapley.", "name": "RevenueProjection", "doc": "Extrapolates player revenues from empirically derived growth rates. project_revenues() compounds each player's history-implied CAGR over the projection horizon (no analyst targets are used).", "methods": ["project_revenues"]}, {"stage": "7. PROJECTION, RISK & COOPERATIVE MODULES -- revenues, portfolio risk, stability, Shapley.", "name": "PortfolioRiskAnalysis", "doc": "Correlated Monte-Carlo over the player revenue portfolio. run_simulation() draws joint revenue paths from _derive_correlation_structure() with marginals from _derive_risk_parameters() (falling back to _derive_default_market_parameters() when history is thin) and reports VaR-style tail statistics for Table A2.", "methods": ["run_simulation"]}, {"stage": "7. PROJECTION, RISK & COOPERATIVE MODULES -- revenues, portfolio risk, stability, Shapley.", "name": "SuccessProbabilityModel", "doc": "Attribute-based stability scores on [0,1] per player. calculate_scores() combines scale, diversification and network-position attributes with fixed transparent weights -- a descriptive composite, not a forecast.", "methods": ["calculate_scores"]}, {"stage": "7. PROJECTION, RISK & COOPERATIVE MODULES -- revenues, portfolio risk, stability, Shapley.", "name": "CooperativeGame", "doc": "Cooperative benchmark: characteristic function and exact Shapley values. characteristic_function() values every coalition from pooled-revenue synergy; calculate_shapley_values() enumerates permutations exactly (tractable for the small player set) to attribute each player's marginal contribution.", "methods": ["characteristic_function", "calculate_shapley_values"]}, {"stage": "8. RESULTS TABLE EXPORTERS -- one method per table (8.1-8.6: robustness battery + validated inputs).", "name": "TableGenerator", "doc": "Writes every results table to CSV, LaTeX and Excel. generate_all_tables() dispatches to one private _generate_table_* method per table (8.1-8.5 cover the robustness battery) and save_all_tables() persists all three formats plus the tables_index.csv registry. _frames_of() normalizes return shapes; _sanitize_latex/_fmt_cell/_table_latex/_table_excel handle format-specific rendering.", "methods": ["generate_all_tables", "save_all_tables"]}, {"stage": "9. 2x2 GAME FRAMEWORK -- payoff construction, Nash solver, game taxonomy.", "name": "GameTheoryFramework", "doc": "Constructs, analyzes, and visualizes 2x2 strategic games for all player pairs. Includes annotations for game concepts, dominant strategies, and best responses.", "methods": ["construct_payoff_matrices", "visualize_2x2_matrix", "find_nash_equilibria", "create_all_matrices_visualization"]}, {"stage": "10. VALUATION & VISUALIZATION -- financials, metrics, figure engine, valuation capstone.", "name": "CompanyFinancials", "doc": "Financial data structure for company valuation. One record per player: revenue, growth, margins, discount rate and risk flags consumed by ValuationMetricsCalculator and the circular-deal haircuts.", "methods": []}, {"stage": "10. VALUATION & VISUALIZATION -- financials, metrics, figure engine, valuation capstone.", "name": "ValuationMetricsCalculator", "doc": "Lightweight calculator returning the fields used downstream. calculate_all_metrics() derives multiples and DCF inputs per player from CompanyFinancials records; deliberately side-effect free so valuation stays a pure function of its inputs.", "methods": ["calculate_all_metrics"]}, {"stage": "10. VALUATION & VISUALIZATION -- financials, metrics, figure engine, valuation capstone.", "name": "VisualizationEngine", "doc": "Renders every publication figure from solved-model outputs (never from raw inputs). One _create_*_figure method per figure-registry entry -- welfare, Monte Carlo, policy, sensitivity, revenue, network, portfolio, stability, Shapley decompositions (welfare, tornado, Saltelli indices, shares, payoffs, efficiency, dynamics) plus conceptual maps. _finalize_figure() applies the publication style, _add_panel_labels() stamps (a)/(b)/... tags, and _gray_of()/_apply_print_safe() implement the GT_PRINT_SAFE=1 grayscale+hatch mode used for the print edition consumed by build_technical_report.py. create_all_visualizations() renders the full registry.", "methods": ["create_all_visualizations"]}, {"stage": "10. VALUATION & VISUALIZATION -- financials, metrics, figure engine, valuation capstone.", "name": "EnhancedValuationAnalyzer", "doc": "Valuation capstone joining DCF-style metrics, game-theoretic positioning and circular-deal exposure. create_company_financials() assembles per-player statements; calculate_all_enhanced_metrics() merges valuation multiples with strategic scores; generate_report()/display_summary_statistics() print the narrative; generate_visualizations()/generate_comparison_table()/export_metrics() emit figures, Table 6.x rows and CSVs.", "methods": ["create_company_financials", "calculate_all_enhanced_metrics", "generate_report", "display_summary_statistics", "generate_visualizations", "generate_comparison_table", "export_metrics"]}, {"stage": "11. CIRCULAR-DEAL ANALYSIS -- round-tripping investment exposure.", "name": "CircularDeal", "doc": "Single round-tripping exposure record (investor, recipient, amount, round): capital the ecosystem recycles between counterparties.", "methods": []}, {"stage": "11. CIRCULAR-DEAL ANALYSIS -- round-tripping investment exposure.", "name": "CircularDealsAnalyzer", "doc": "Quantifies circular (round-tripping) investment exposure between players. _exposure() nets bilateral flows; dcf_adjust() haircuts valuations for recycled capital; portfolio_risk() adds the concentration charge; calc_metrics() bundles headline statistics; _get_factor() looks up the round-specific haircut.", "methods": ["dcf_adjust", "portfolio_risk", "calc_metrics"]}, {"stage": "8. TEST FRAMEWORK & CLI HANDLER", "name": "BubbleBurstAnalyzer", "doc": "AI-bubble formation odds, burst shock propagation, GDP impact and ranking. Extends the circular-deals accounts (CircularDealsAnalyzer) into a burst scenario: how likely bubble conditions are, who loses what when circular capital impairs, what that means for GDP, and which government interventions blunt the loss. Every number is scenario arithmetic with stated parameters -- not a forecast. Methods: formation_probability() per-archetype bubble-conditions probability via a documented logistic composite (circular exposure, capex intensity, HHI share, valuation exuberance) with a stated sensitivity band; open_weights=True adds the open-weight margin-compression term. burst_impact() direct circula", "methods": ["formation_probability", "burst_impact", "open_weights_shock", "open_weights_debtrank", "gdp_impact", "bubble_policy", "geography_overlay", "save_all"]}, {"stage": "8. TEST FRAMEWORK & CLI HANDLER", "name": "DebtRankClearingEngine", "doc": "Second-round contagion on the committed edges of the dependency frame (DebtRank). First-order burst propagation (Table 7.11) stops after one dependency round (A9). This engine runs the full reverberation after Battiston et al. (2012): four archetype nodes, directed exposures aggregated from the dependency frame, equity buffers from validated market caps, and initial distress from severe direct burst losses. Non-archetype counterparties (SOURCE_MAP) are folded into the system or treated as external creditors that contribute shock without propagating. Outputs Table 7.14 with DebtRank scores, second-round dollar losses and the contagion multiplier over the first-order floor.", "methods": ["impact_matrix", "run", "summary", "save_all"]}, {"stage": "8. TEST FRAMEWORK & CLI HANDLER", "name": "CreditMonitor", "doc": "Credit-market monitor: CDS, ratings, maturity and collateral haircuts. Grounds the GPU-collateral lending-cap remedy and the downgrade watchlist in market prices. Market observations from the September 2026 vintage compiled for this run_pipeline (Oracle $18B single-day bond, 215bp CDS print, BBB- downgrade, $570B 2026 debt run_pipeline) are encoded as constants; every computed row derives from those plus live run_pipeline tables. No firm-level spread is invented: the implied hazard uses a stated 40% recovery, haircuts are stated scenario parameters, and the watchlist order reproduces the live burst ranking. Outputs Table 7.15 (Metric/Value/Basis ledger).", "methods": ["hazard_approx", "pipeline_to_capex", "watchlist", "ledger", "save_all"]}, {"stage": "8. TEST FRAMEWORK & CLI HANDLER", "name": "StructuralEstimationAnalyzer", "doc": "Breakdown-frontier calibration of the A3 rate maps and A8 logit weights. The A3 temptation/sucker slopes and the A8 formation-logit weights are judgment values with stated bands, not sample estimates (four archetypes admit no MLE). This module replaces the judgment claim with identified sets: for each coefficient, coordinate-wise bisection finds the largest interval around its base value that preserves the published qualitative results --- all six pure-strategy Nash position sets (A3) and the exact formation order (A8). Wide intervals mean the conclusions do not hang on the judgment values; narrow ones mark where re-estimation matters most. Outputs Table 8.7. Method note: the formation covar", "methods": ["nash_positions", "formation_order", "joint_order_check", "calibrate", "save_all", "tex_interval_macros", "write_tex_macros"]}, {"stage": "12. VERIFICATION & ENTRY POINT -- embedded smoke gate and main() run_pipeline.", "name": "WelfareTransition", "doc": "One game's Nash-to-joint-maximum transition with its welfare verdict. Records both players' Nash and joint-maximum payoffs and profiles, the individual deltas and their sum (joint_gain), plus the classification ('Pareto improvement', 'Kaldor-Hicks (transfer required)', or 'No improvement available') with the minimum compensating transfer and its payer/payee. Rows of Table 3.5; consumed by ParetoClassifier.summary() and the G6 integrity gate.", "methods": []}, {"stage": "12. VERIFICATION & ENTRY POINT -- embedded smoke gate and main() run_pipeline.", "name": "ParetoClassifier", "doc": "Classifies Nash-to-joint-max transitions correctly. \u201cPareto\u201d requires both players to be weakly better off. A joint-payoff maximum that harms either player is a Kaldor-Hicks improvement and needs a compensating, enforceable transfer. The joint gain remains valid; only the welfare interpretation changes.", "methods": ["classify", "summary", "check_g6"]}, {"stage": "12. VERIFICATION & ENTRY POINT -- embedded smoke gate and main() run_pipeline.", "name": "EquilibriumMultiplicityAuditor", "doc": "Exhaustively enumerates weak-best-response pure Nash equilibria.", "methods": ["pure_equilibria", "risk_dominance", "check_g7"]}, {"stage": "12. VERIFICATION & ENTRY POINT -- embedded smoke gate and main() run_pipeline.", "name": "RepeatedGameAnalyzer", "doc": "Grim-trigger sustainability of the joint-max benchmark (A7 audit).", "methods": ["analyze"]}, {"stage": "12. VERIFICATION & ENTRY POINT -- embedded smoke gate and main() run_pipeline.", "name": "TestFramework", "doc": "Embedded smoke gate: data consistency, equilibrium validity, table/figure completeness. load_tests() assembles the suite (DATA_CONSISTENCY must pass before any downstream check is trusted); run_all_tests() executes it and returns the pass/fail tally consumed by main()'s exit code.", "methods": ["load_tests", "run_all_tests"]}]}, "report": {"sections": [{"title": "Front matter", "blocks": [{"h": "", "paras": [{"t": "AI ECOSYSTEM GAME THEORY ANALYSIS", "insight": false}, {"t": "Market Structure, Strategic Interaction, and Welfare", "insight": false}, {"t": "Technical & Validation Report", "insight": false}, {"t": "Ranjith Keerikkattil", "insight": false}, {"t": "WORKING PAPER", "insight": false}, {"t": "Prepared for journal submission. All market figures are dated Q2/Q3 2026 and cross-validated from primary sources (company filings, SEC, tier-1 financial media).", "insight": false}], "tables": [{"caption": "Table", "cols": ["Report date", "September 28, 2026"], "rows": [["Data vintage", "Q3 2026 (Aug-Sep earnings cycle)"], ["Data module version", "v10.0"], ["Script", "ai_ecosystem_model.py (11,507 lines; V8.0)"], ["Analysis engine", "ai_ecosystem_model.py embedded data + analysis classes (recomputed for this report)"], ["Scope", "4 player archetypes \u00b7 6 bilateral games \u00b7 circular-deals & welfare analysis"], ["Units", "Monetary values in $B unless noted; September 2026 vintage"]]}]}]}, {"title": "Abstract", "blocks": [{"h": "", "paras": [{"t": "This paper presents a computational analysis of strategic interaction in the artificial-intelligence ecosystem through game theory, welfare economics, and market-concentration analysis. Four player archetypes \u2014 Hardware, Cloud Providers, Foundation Models, and LLM Wrappers, with aggregate revenue of $1,034.5B (Q2/Q3 2026 vintage) \u2014 interact as six bilateral 2\u00d72 games solved for pure-strategy Nash equilibria by best-response analysis, with welfare measured against the joint-surplus maximum (Kaldor\u2013Hicks benchmark).", "insight": false}, {"t": "The market is highly concentrated (HHI 3,851, CR4 100.0%). Aggregate welfare at the Nash outcome is $1,034.5B against a potential $1,451.3B \u2014 a deadweight loss of $416.8B (71.3% efficiency). The core Hardware\u2013Cloud Providers game is a distributive obstruction: the Nash outcome differs from a joint-surplus maximum that requires compensating transfers; equilibrium stability and policy scenarios are evaluated with Monte-Carlo simulation and sensitivity analysis, and every figure and table below is an artifact of the ai_ecosystem_model.py run_pipeline, re-verified by this generator.", "insight": false}, {"t": "Keywords: game theory; Nash equilibrium; deadweight loss; market concentration; HHI; Lerner index; Monte Carlo; AI ecosystem; antitrust; interoperability.", "insight": false}], "tables": []}]}, {"title": "Contents", "blocks": [{"h": "", "paras": [{"t": "If the table of contents does not display, select it and press F9 in Word (or set Tools \u2192 Options \u2192 Print \u2192 Update fields).", "insight": false}], "tables": []}]}, {"title": "List of Tables", "blocks": [{"h": "", "paras": [], "tables": [{"caption": "Table", "cols": ["Table", "Section"], "rows": [["Exhibit 2.1  Player archetypes and market data (computed by build_technical_report.py)", "Section 2"], ["Exhibit 2.2  Data sources and macro parameters", "Section 2"], ["Exhibit 2.6  Literature-to-report mapping (compiled by build_technical_report.py)", "Section 2"], ["Table 8.5: Assumption Register", "Section 2"], ["Table 8.6 (excerpt) \u2014 Validated inputs register (first 10 of 110 rows)", "Section 2"], ["Table 2.4: Player Categories", "Section 2"], ["Table 8.6: Validated Inputs Register", "Section 2"], ["Exhibit 3.1  Concentration metrics (computed by build_technical_report.py)", "Section 3"], ["Exhibit 3.2  Market shares (computed by build_technical_report.py)", "Section 3"], ["Exhibit 3.3  Market power (Lerner-based, computed by build_technical_report.py)", "Section 3"], ["Table 7.17: Lerner Index & Markup Summary with Uncertainty Bands", "Section 3"], ["Exhibit 3.4  Gatekeeper index: who the ecosystem cannot route around (ai_ecosystem_model.py diagnostics)", "Section 3"], ["Table 1.1: Market Structure Metrics", "Section 3"], ["Table 1.3: Revenue Projections", "Section 3"], ["Table 7.16: Market-Share Evolution 2025 vs 2030 (Revenue Projections)", "Section 3"], ["Exhibit 4.1  Nash equilibria across all bilateral games (computed by build_technical_report.py)", "Section 4"], ["Exhibit 4.2  Payoff matrix \u2014 Hardware-Cloud Providers ($B; row: Hardware, column: Cloud Providers)", "Section 4"], ["Exhibit 4.3  Payoff matrix \u2014 Hardware-Foundation Models ($B; row: Hardware, column: Foundation Models)", "Section 4"], ["Exhibit 4.4  Payoff matrix \u2014 Hardware-LLM Wrappers ($B; row: Hardware, column: LLM Wrappers)", "Section 4"], ["Exhibit 4.5  Payoff matrix \u2014 Cloud Providers-Foundation Models ($B; row: Cloud Providers, column: Foundation Models)", "Section 4"], ["Exhibit 4.6  Payoff matrix \u2014 Cloud Providers-LLM Wrappers ($B; row: Cloud Providers, column: LLM Wrappers)", "Section 4"], ["Exhibit 4.7  Payoff matrix \u2014 Foundation Models-LLM Wrappers ($B; row: Foundation Models, column: LLM Wrappers)", "Section 4"], ["Table 3.5 \u2014 Welfare-benchmark audit (Kaldor-Hicks transfers)", "Section 4"], ["Table 3.6 \u2014 Equilibrium multiplicity and risk-dominance audit", "Section 4"], ["Table 3.7 \u2014 Repeated-game sustainability (critical discount factors)", "Section 4"]], "truncated": "60 rows total; first 25 shown"}]}]}, {"title": "List of Figures", "blocks": [{"h": "", "paras": [], "tables": [{"caption": "Table", "cols": ["Figure", "Section"], "rows": [["Figure 1: Framework & Literature Map (schematic)", "Section 2"], ["Figure 2: Research Design & Stages (schematic)", "Section 2"], ["Figure 4: Value Chain (schematic)", "Section 2"], ["Supplemental S2 \u2014 Lerner Index with Uncertainty Bands", "Section 3"], ["Supplemental S1 \u2014 Revenue Levels 2025 vs 2030", "Section 3"], ["Figure 3: Market Size, Concentration & Shares [Panels: (a), (b), (c)]", "Section 3"], ["Figure 13: Revenue Projections (schematic)", "Section 3"], ["Supplemental S5 \u2014 Joint Gains and Minimum Transfers by Game", "Section 4"], ["Figure 5: Complete Matrices (schematic)", "Section 4"], ["Figure 6: Core Game: Equilibrium & Payoffs (schematic)", "Section 4"], ["Figure 11: Dynamics & Stability [Panels: (a), (b)]", "Section 4"], ["Figure 7: Welfare Composite [Panels: (a), (b), (c), (d)]", "Section 5"], ["Figure 12: Policy Simulation (schematic)", "Section 5"], ["Figure 8: Monte Carlo Convergence [Panels: (a), (b)]", "Section 6"], ["Figure 9: Sensitivity Response (schematic)", "Section 6"], ["Figure 10: Sobol Indices (schematic)", "Section 6"], ["Supplemental S3 \u2014 Shapley Share vs Revenue Share", "Section 7"], ["Figure 14: Network Risk (schematic)", "Section 7"], ["Figure 15: Portfolio Risk (schematic)", "Section 7"], ["Figure 16: Shapley Values (schematic)", "Section 7"], ["Supplemental S4 \u2014 Direct vs Second-Round Losses (DebtRank)", "Section 7"], ["Figure 17: Company Valuation Dashboard (schematic)", "Section 8"], ["Figure 18: Company Valuation Metrics Table (schematic)", "Section 8"]]}]}]}, {"title": "List of Abbreviations", "blocks": [{"h": "", "paras": [], "tables": [{"caption": "Table", "cols": ["Abbreviation", "Definition"], "rows": [["AI", "Artificial Intelligence"], ["BCR", "Benefit\u2013Cost Ratio"], ["CI", "Confidence Interval"], ["CR4", "Concentration Ratio (top 4 archetypes)"], ["DWL", "Deadweight Loss"], ["HHI", "Herfindahl\u2013Hirschman Index"], ["K-H", "Kaldor\u2013Hicks (joint-surplus benchmark requiring transfers)"], ["LLM", "Large Language Model"], ["MC", "Monte Carlo (simulation)"], ["NE", "Nash Equilibrium"], ["TTM", "Trailing Twelve Months (valuation inputs)"], ["JM", "Joint-Surplus Maximum (Kaldor\u2013Hicks Benchmark)"]]}]}]}, {"title": "1.  Executive Summary", "blocks": [{"h": "", "paras": [{"t": "This report documents the AI-ecosystem game-theory analysis produced by ai_ecosystem_model.py. It synthesizes an estimated aggregate market revenue of $1,034.5B across four player archetypes (Hardware, Cloud Providers, Foundation Models, and LLM Wrappers) whose strategic interaction is modeled as six bilateral 2\u00d72 games, with equilibrium outcomes, welfare losses, circular-dependency risk, and policy implications evaluated quantitatively.", "insight": false}, {"t": "Market structure: Total revenue $1,034.5B; HHI 3,851 (highly concentrated); CR4 100.0%; Gini 0.393. Cloud Providers (40.3%) and Hardware (45.9%) dominate.", "insight": false}, {"t": "Strategic games: 6 bilateral games analyzed. The core Hardware\u2013Cloud Providers game is a coordination failure: the Nash equilibrium (Open Access, Proprietary Stack) is not a joint-surplus maximum (Kaldor\u2013Hicks benchmark), with a game-level deadweight loss of $58.6B.", "insight": false}, {"t": "Welfare: Aggregate welfare at the Nash outcome is $1,034.5B vs. a potential (Pareto) $1,451.3B, implying a deadweight loss of $416.8B (28.7% of potential) and aggregate efficiency of 71.3%.", "insight": false}, {"t": "Circular dependency: 19 circular deals totaling $1,188.3B; systemic criticality score 0.632.", "insight": false}, {"t": "Cooperation: Shapley allocation across the four players; cooperative surplus of the grand coalition \u2248 $310.4B.", "insight": false}, {"t": "Best policy (base scenario): Combined Intervention \u2014 net benefit $214.2B.", "insight": false}], "tables": []}, {"h": "1.1  Headline metrics", "paras": [], "tables": [{"caption": "Table", "cols": ["Metric", "Value"], "rows": [["Aggregate market revenue", "$1,034.5B"], ["HHI / CR4 / Gini", "3,851 / 100.0% / 0.393"], ["Market-implied DWL", "28.72%  ($416.8B)"], ["Aggregate welfare (Nash)", "$1,034.5B"], ["Aggregate efficiency", "71.28%"], ["Coordination-failure DWL", "$867.77B"], ["Circular exposure", "$1,188.3B"], ["Core game NE", "Hardware: Open Access; Cloud: Proprietary Stack"]]}]}, {"h": "1.2  Research questions", "paras": [{"t": "RQ1 \u2014 Market concentration and power.  How concentrated is the AI ecosystem and how much pricing power follows? Measured: HHI 3,851 against both the 2010 (2,500) and 2023 (1,800) highly-concentrated thresholds, with Lerner-implied markups per archetype (Exhibit 3.3).", "insight": false}, {"t": "RQ2 \u2014 Nash equilibria and strategic behavior.  What are the equilibria of the six bilateral games, and do they coincide with Pareto optima? The core Hardware\u2013Cloud game is a coordination failure (Nash versus joint-surplus maximum, DWL $58.6B); Section 4 reports all six (Exhibits 4.1\u20134.7).", "insight": false}, {"t": "RQ3 \u2014 Structural inefficiency sources.  How is the $416.8B aggregate deadweight loss attributed across switching costs, monopoly pricing, innovation distortion, quality degradation, and coordination failures (Exhibit 5.2)?", "insight": false}, {"t": "RQ4 \u2014 Policy effectiveness.  Which interventions \u2014 interoperability mandates, antitrust enforcement, innovation subsidies, data-sharing mandates, or combinations \u2014 deliver the highest net benefit under conservative, base, and optimistic scenarios (Exhibit 5.2b and Section 5 deep dives)?", "insight": false}], "tables": []}, {"h": "1.3  Research objectives", "paras": [{"t": "Model the four-layer AI ecosystem as six bilateral 2\u00d72 games with market-derived payoffs.", "insight": false}, {"t": "Quantify concentration (HHI, CR4, Gini) and market power (elasticity-based Lerner indices).", "insight": false}, {"t": "Decompose aggregate deadweight loss by structural source with quantitative attribution.", "insight": false}, {"t": "Validate robustness with 100,000 Monte-Carlo draws and sensitivity sweeps around the DWL assumption.", "insight": false}, {"t": "Rank costed policy interventions across scenarios and state the evidence basis for each recommendation.", "insight": false}], "tables": []}]}, {"title": "2.  Data, Sources and Methodology", "blocks": [{"h": "2.1  Embedded data and vintage", "paras": [{"t": "The analysis uses ai_ecosystem_model.py's embedded dataset (data module v10.0, validation status: Deep Research Verified (Multi-Source); last updated 2026-09-06). All monetary figures are in billions of U.S. dollars and reflect the Q2/Q3 2026 reporting cycle.", "insight": false}, {"t": "Macro context: MAJOR ECOSYSTEM SHIFT: The \"circular AI economy\" concern intensified in Q3 2026 with NVIDIA extending $605B+ in direct + indirect financing ($105B OpenAI credit guarantee + $500B six-platform MOU facility). Anthropic ARR growth from $9B (Dec 2025) to $65B (Jul 2026) is unprecedented but comes with $80B compute commitments extending to 2030-32. Fed hike pricing swung 48-75% through summer 2026 (CME FedWatch 48.4% early Sep after Waller remarks; WSJ Aug 12 \"hike not looking likely\"); policy rate 3.50-3.75% adds macro pressure. SEP 6 2026 RE-VERIFICATION vs primary/near-primary sources: NVIDIA TTM rev $302.9B + net ~$192B (company IR Aug 26 2026); NVDA equity portfolio ~$99B (10-Q Jul 26 2026); Hugging Face $12.93B (Sep 3 2026); AWS $169B run-rate, GCP $99B, Azure FY26 $101.9B; Palantir FY guide $7.7B (SEC 8-K); ServiceNow FY guide $16.2B; Cursor ~$4B ARR (SpaceX-owned since Jun 2026); OpenAI-AWS $38B (Nov 2025, multi-source); US 2025 GDP $30,767.1B (BEA NIPA); 10Y 4.795% Sep 1 (WSJ); 2Y 4.392% and 30Y 5.27% Sep 1 (FRED/Morningstar); ERP 4.2% (Damodaran end-2025/mid-2026); IDC AI CAGR 29-32% (Spending Guide/FutureScape 2026); Big Four 2025 capex ~$400B actuals; PwC $31.", "insight": false}], "tables": [{"caption": "Exhibit 2.1  Player archetypes and market data (computed by build_technical_report.py)", "cols": ["Category", "Representative players", "Revenue ($B)", "Market value ($B)", "Op. margin", "Circ. index"], "rows": [["Hardware", "NVIDIA, AMD, Intel, Broadcom, Marvell, Google (TPU)", "475", "7,916", "48.0%", "0.31"], ["Cloud Providers", "Microsoft Azure, AWS, Google Cloud, Oracle, CoreWeave, Nebius, Lambda Labs", "417", "11,910", "34.0%", "0.29"], ["Foundation Models", "OpenAI, Anthropic, Meta (Llama), Mistral, xAI", "106.50", "2,432", "-3.4%", "0.84"], ["LLM Wrappers", "Palantir, ServiceNow, Databricks, Perplexity, Cursor", "36", "923", "19.0%", "0.65"]]}, {"caption": "Exhibit 2.2  Data sources and macro parameters", "cols": ["Parameter", "Source"], "rows": [["market_size", "Aggregate of verified company revenues"], ["tam", "PwC Global Data Center Outlook 2026-50 (Oxford Economics modeling): $31.6T central cumulative, $800B in 2026 to $1.1T 20"], ["growth", "IDC Spending Guide 29% CAGR 2024-2028; IDC FutureScape 2026: 32% 5-yr AI IT spending CAGR; UBS AI capex 25% CAGR to $1.3"], ["risk_free_rate", "U.S. Treasury 10-year yield, Sep 1, 2026 (Bloomberg)"], ["market_return", "Damodaran (NYU Stern) implied ERP 4.18% end-2025, mature-market base 4.17% mid-2026 update"], ["circular_deals", "CNBC, Reuters, Bloomberg, FT (multi-source Sep 2026)"], ["valuation_data", "Company IR pages + NPM secondary market data"]]}]}, {"h": "2.2  Methodological choices", "paras": [{"t": "Players are the four archetypes Hardware, Cloud Providers, Foundation Models and LLM Wrappers; each bilateral interaction is a 2\u00d72 game with strategies defined per player.", "insight": false}, {"t": "Payoffs are derived from market data: the Defect\u2013Defect cell equals observed revenue; cooperation expands the total to an efficient benchmark; temptation and sucker payoffs are calibrated from margins and dependency exposure.", "insight": false}, {"t": "Deadweight loss is market-implied: DWL% \u2248 min(40%, max(5%, circular-exposure \u00f7 revenue \u00d7 25%)) = 28.72%, i.e. $416.8B on potential (Pareto) welfare.", "insight": false}, {"t": "Nash equilibria are found by best-response analysis; welfare is measured as the distance from the maximum-total joint-surplus outcome (Kaldor\u2013Hicks benchmark); coordination failures are Nash outcomes that miss the Pareto optimum.", "insight": false}, {"t": "Robustness is assessed with 100,000 Monte-Carlo draws at 5% log-normal payoff noise and a 98% confidence interval, plus sensitivity analysis around the DWL assumption.", "insight": false}], "tables": []}, {"h": "2.3  Equilibrium concepts used in this report", "paras": [{"t": "Nash equilibrium (Nash, 1950): a strategy profile from which no player can profitably deviate unilaterally. All six games are solved by exhaustive best-response checks over the four cells \u2014 no equilibrium is assumed.", "insight": false}, {"t": "Prisoner's Dilemma: temptation > cooperation > defection > sucker payoffs, so mutual defection is the equilibrium although mutual cooperation pays more. The core Hardware\u2013Cloud game is classified 'Coordination Failure'; Section 4 classifies all six.", "insight": false}, {"t": "Joint-surplus maximum and distributive obstruction: a true Pareto improvement leaves no player can gain without another losing; a coordination failure is Nash \u2260 party worse off; a Kaldor\u2013Hicks benchmark requires compensation. Positive Nash\u2013joint-max gaps measure forgone joint surplus.", "insight": false}, {"t": "Second-best (Lipsey & Lancaster, 1956): with several simultaneous distortions, fixing one in isolation need not improve welfare \u2014 the rationale for ranking combined as well as standalone interventions in Section 5.", "insight": false}], "tables": []}, {"h": "2.4  Market-power and welfare measurement", "paras": [{"t": "Concentration: HHI is the sum of squared percentage market shares (0\u201310,000). Both DOJ/FTC vintages are used throughout \u2014 2010: 1,500/2,500; current 2023: 1,000/1,800 (highly concentrated, +100pts presumption). This market exceeds both high cutoffs, so the verdict does not depend on vintage.", "insight": false}, {"t": "Market power: the Lerner index L = (P \u2212 MC)/P = 1/|elasticity| measures pricing power on a 0\u20131 scale (0 perfect competition, 1 monopoly). The highest implied Lerner index in this run is 0.623 (Hardware).", "insight": false}, {"t": "Deadweight loss (Harberger, 1954): the surplus triangle lost when price exceeds marginal cost, growing with the square of the markup \u2014 which is why the high-markup archetypes dominate the loss. In this run the aggregate loss splits as switching costs 34%, innovation distortion 26%, quality degradation 17%, coordination failures 14%, monopoly pricing 9%.", "insight": false}, {"t": "Switching costs and lock-in (Katz & Shapiro, 1985; Farrell & Klemperer, 2007): platform incompatibilities and data gravity sustain pricing power even in equilibrium, so part of the loss persists under any conduct remedy \u2014 the structural interpretation developed in Sections 5\u20136.", "insight": false}], "tables": []}, {"h": "2.5  Computation, reproducibility and figure provenance", "paras": [{"t": "Two distinct deadweight-loss rates are used (ai_ecosystem_model.py DWL naming conventions). The top-down rate DWL_PCT_TOPDOWN = 28.72% (dependency-value ratio) feeds aggregate welfare, policy and sensitivity analysis. The game-level rate 15.20% (concentration/dependency geometric mean) is a recorded diagnostic only \u2014 payoff levels derive from pair efficiency, margins and dependencies. They answer different questions and must not be conflated.", "insight": false}, {"t": "Monte Carlo is vectorized (batched log-normal draws, numpy best-response masks; statistically identical to the per-draw loop) with run-scoped generators seeded 42 \u2014 each game gets an independent noise stream and repeated runs reproduce exactly.", "insight": false}, {"t": "Figures render headless-safe (Agg backend), use the Okabe\u2013Ito colorblind-safe palette in DejaVu Sans, carry journal-style (a)/(b) panel tags on data panels, and are saved as 300-DPI PNG plus vector PDF; panel inventories come from ai_ecosystem_model.py's figure_captions.md when present.", "insight": false}, {"t": "Convergence is assessed with Monte-Carlo standard errors and split-half consistency from stored draws (table_7.9); R-hat is not reported because it is uninformative for IID Monte Carlo. Equilibria are cross-validated by an independent brute-force enumeration (table_7.8).", "insight": false}, {"t": "A five-part robustness battery (ai_ecosystem_model.py RobustnessBattery, Tables 8.1\u20138.5) backs every headline: (R1) Geweke mean-stability screens with Holm correction across games; (R2) full-sample reruns at two independent seeds with drift measured in pooled standard errors; (R3) perturbation-scale robustness at 2.5/5/10% noise with Spearman rank preservation; (R4) Saltelli variance decomposition (N=2048, 500 bootstraps) of game DWL over calibrated primitives; (R5) an explicit assumption register mapping each modeling choice to the check that disciplines it. All stochastic steps derive from seeded generators, so the battery reproduces exactly.", "insight": false}], "tables": []}, {"h": "2.6  Literature review", "paras": [{"t": "Recent (2025\u20132026) work on AI markets falls into five streams that jointly motivate this report's design. Each stream is summarized below with its direct bearing on the research questions; full citations are in References. Where the literature disagrees, the disagreement is stated explicitly and carried forward as a robustness check or limitation.", "insight": false}], "tables": []}, {"h": "Scaling, concentration, and market structure", "paras": [{"t": "Korinek and Vipra (2025) argue that AI markets concentrate even without anticompetitive conduct, through three jointly-operating features: very large fixed training costs, cost advantages that grow with size, and high customer switching costs \u2014 with concentration threatening an unprecedented accumulation of economic power. Their framework is the direct antecedent of this report's measurement strategy: the HHI/CR4/Gini battery (Section 3, RQ1) and the Lerner-based market-power assessment (Exhibit 3.3) operationalize exactly those three channels.", "insight": false}, {"t": "Hagiu and Wright (2025) analyze the vertical AI technology stack and data feedback loops around three questions \u2014 concentration in core AI services, AI's impact on existing market structures, and emerging policy challenges \u2014 identifying risks of new gatekeeper types alongside disruption of old platforms. Their layered view matches this report's four-archetype model, and their gatekeeper analysis anticipates the bottleneck finding of Section 4. Korinek and Vipra (2025) trace how scaling concentrates the AI stack and how upstream power moves downstream prices, industry structure, and welfare \u2014 the theoretical counterpart of the deadweight-loss decomposition in Section 5 (RQ3), with frontier scale economies as the limiting case.", "insight": false}, {"t": "The contestability counterpoint matters for RQ1: if power-law capability scaling plus fast-follower dynamics keep training costs contestable, concentration findings weaken. This report does not adjudicate that debate; instead the sensitivity analysis (Section 6) and the DWL-elasticity reading test how much the conclusions move if contestability is stronger than the base case assumes.", "insight": false}], "tables": []}, {"h": "Competition policy and antitrust", "paras": [{"t": "A restraint counter-argument runs the other way: preemptive regulatory approaches to platform\u2013laboratory partnerships and investments in the generative-AI ecosystem risk false positives, counselling doctrinal humility. That sets the evidentiary bar Section 5 must clear \u2014 ranked, costed, scenario-bound interventions rather than precautionary ones. Institutional reviews pull the other way: the OECD (2025) documents multifaceted, evolving concentration risks across stack layers including tying and algorithmic collusion, while the World Bank (2026) finds end-user outcomes largely predetermined by control of critical upstream infrastructure \u2014 consistent with this report's infrastructure-bottleneck diagnosis. The operative legal regime for the interoperability remedy is the EU Digital Markets Act (European Commission, 2022), cited as precedent in the policy deep dives.", "insight": false}], "tables": []}, {"h": "Game theory and algorithmic collusion", "paras": [{"t": "Bichler et al. (2025) survey when pricing algorithms converge to Nash equilibria (notably in potential games) versus collusive outcomes, and which algorithm properties tilt the balance. Their convergence conditions inform this report's stability reading in Section 6: high Monte-Carlo stability is interpreted as structural lock-in rather than coincidence. This report's one-shot bilateral design is a static-game analysis, and the repeated-game gap it leaves is recorded as future work (Section 9.3).", "insight": false}], "tables": []}, {"h": "Circular investment and systemic fragility", "paras": [{"t": "Realized revenue and adoption support part of AI valuations, while capex outruns monetization in some layers and private valuations concentrate in few firms \u2014 the dot-com precedent for transformative technology alongside overvaluation (Ofek, 2003; Greenwood et al., 2019). That 'localized fragility' framing disciplines Section 7: the bubble score is presented as a fragility index, not a crash prediction. The financing channel provides the transmission mechanism behind the single-point-of-failure reading of the NVIDIA-centered deal fabric: the dependency frame and credit monitor in Section 7 trace how a repricing travels from circular claims to equity and GDP.", "insight": false}], "tables": []}, {"h": "Circular-dealing measurement and vendor-financing contracts", "paras": [{"t": "Round-trip chains run through multiple stack layers, which supports this report's archetype-stack design over pairwise analysis; the committed-value exposure frame books contracted circularity deal by deal, with conditional tranches parked outside it. Two contract patterns organize the channel: an integration-plus-circular-investment pattern (vertical integration plus circular investment; apparent sales that reverse on a demand shock) and a GPU-collateralised leverage pattern (supplier resale guarantees, herd entry, and chain-reaction fire sales of homogeneous collateral). The fire-sale cascade is the statically-modeled second round of this report's DebtRank reverberation (Section 7, Exhibit 7.8); dynamic clearing with endogenous leverage remains open. The run_pipeline documents the leverage stack it would detonate \u2014 $675.40B in committed exposure across 17 edges ($1,188.33B tracked over 19 rows), the 2026 debt run_pipeline, Oracle's single-day bond sale and off-balance-sheet vehicle, and the record CDS print with downgrade to BBB- \u2014 all recorded in the September 2026 market-data vintage; the Oracle repricing corroborates the burst ranking. The ex-post agenda is priced as the compl", "insight": false}], "tables": []}, {"h": "Interoperability and policy mechanisms", "paras": [{"t": "The interoperability remedy rests on cross-sector precedent: mandated infrastructure unbundling (telecoms) and open-banking standardisation show mandates can unlock downstream entry, while the payments experience shows mandates without standardisation fragment into competing API standards (Ofcom, discussion paper on mandated interoperability in digital markets). That caveat is priced into Section 5: the API-mandate deep dive carries implementation cost and scenario bounds rather than assuming frictionless adoption. Data-portability and shared-access arguments (cf. OECD, 2025) motivate the data-sharing mandate alternative ranked alongside it.", "insight": false}, {"t": "Taken together, the literature supports measuring concentration before asserting power (Korinek and Vipra; Hagiu and Wright), tracing upstream power to downstream welfare (Korinek and Vipra), testing stability rather than assuming it (Bichler et al.), treating circularity as fragility rather than growth, and costing remedies against scenarios rather than asserting them. The mapping below records where each stream binds on this report.", "insight": false}], "tables": [{"caption": "Exhibit 2.6  Literature-to-report mapping (compiled by build_technical_report.py)", "cols": ["Literature stream", "Key sources", "Report locus", "What this report adds"], "rows": [["Scaling \u2192 concentration", "Korinek & Vipra (2025)", "\u00a73, RQ1", "HHI/CR4/Gini plus Lerner-implied markups on Q2/Q3 2026 data"], ["Vertical stack & gatekeepers", "Hagiu & Wright (2025); World Bank (2026); OECD (2025)", "\u00a74, RQ2", "Six solved bilateral games; bottleneck located, not assumed"], ["Upstream power \u2192 welfare", "Korinek & Vipra (2025)", "\u00a75, RQ3", "$-level DWL decomposition by source"], ["Equilibrium convergence/stability", "Bichler et al. (2025)", "\u00a76", "Monte-Carlo stability of each game's NE"], ["Bubble precedent & fragility", "Ofek (2003); Greenwood et al. (2019)", "\u00a77", "Bubble score as fragility index; NVIDIA-share of deal value"], ["Circularity measurement", "FTC (2025); BIS (2026)", "\u00a77", "Committed-value exposure frame; fire-sale round noted as unmodeled"], ["Remedies & restraint", "DMA (2022); Ofcom", "\u00a75.1, RQ4", "Costed, scenario-bound ranking with BCRs"]]}]}, {"h": "2.7  Assumptions register", "paras": [], "tables": [{"caption": "Table 8.5: Assumption Register", "cols": ["#", "Assumption", "Used in", "Justification", "Checked by", "Risk if violated"], "rows": [["A1", "Bilateral 2x2 games capture the strategic structure", "All games", "Standard IO framing; matches report game taxonomy", "R2/R3 (NE stability under perturbation)", "Misses N-player dynamics"], ["A2", "Log-normal 5% payoff noise represents measurement error", "Monte Carlo", "Multiplicative-error convention for revenue-scale payoffs", "R3 (sigma 2.5/5/10%)", "Over/under-stated stability"], ["A3", "Deviation gains/losses are share-scaled to own CC payoffs with player-specific rates (own margin \u2192 temptation; own circu", "Payoff calibration", "Proportional-to-stakes convention; uses validated Operating_Margin and Circular_Dependency_Index (improved Sep 6 2026; w", "Saltelli surrogate replicates the same algebra; brute-force NE agreement tests", "Residual: linear rate maps are conventions, not estimated; small-player leverage still approximate"], ["A4", "Pareto benchmark = observed total scaled by pair efficiency", "Welfare/DWL", "Revealed-efficiency benchmark; efficiency floored at 0.75", "R4 (efficiency-adjacent margins decomposed)", "Pareto level mis-set"], ["A5", "Saltelli priors: independent Uniform \u00b120% around c urces; all 19 circular deals; and the audited scope decisions (inclusions, updates, exclusions). It is built live from the canonical ai_ecosystem_model.py structures, so the values below are the values the models ran on.", "insight": false}, {"t": "The complete 110-row register, with a source or verification note per input, appears as Table 8.6 in Appendix A.", "insight": false}], "tables": [{"caption": "Table 8.6 (excerpt) \u2014 Validated inputs register (first 10 of 110 rows)", "cols": ["ID", "Category", "Parameter", "Value", "Unit", "Source/Verification"], "rows": [["V-HA-REV", "Archetype fundamentals", "Hardware revenue", "475.0", "$B", "Verified Sep 6 2026 vs primary sources (see revenue code comments)"], ["V-HA-VAL", "Archetype fundamentals", "Hardware market valuation", "7916.0", "$B", "Verified Sep 6 2026 vs market caps/rounds (see valuation code comments)"], ["V-HA-MGN", "Archetype fundamentals", "Hardware operating margin", "0.480", "rate", "Revenue-weighted from Q2/FY26 filings (see margin code comments); display-only"], ["V-HA-PRF", "Archetype fundamentals", "Hardware profitability label", "High Positive", "label", "Follows the blended margin above"], ["V-HA-RSK", "Archetype fundamentals", "Hardware strategic risk", "Medium", "label", "Judgment: sub-segment blend (see code comments)"], ["V-HA-CIR", "Archetype fundamentals", "Hardware circular dependency index", "0.31", "index 0-1", "Revenue-weighted judgment (see code comments)"], ["V-HA-COS", "Archetype fundamentals", "Hardware key companies", "NVIDIA, AMD, Intel, Broadcom, Marvell, Google (TPU)", "list", "Coverage audited Sep 6 2026 (see PLAYER-COVERAGE note in market metadata)"], ["V-CL-REV", "Archetype fundamentals", "Cloud Providers revenue", "417.0", "$B", "Verified Sep 6 2026 vs primary sources (see revenue code comments)"], ["V-CL-VAL", "Archetype fundamentals", "Cloud Providers market valuation", "11910.0", "$B", "Verified Sep 6 2026 vs market caps/rounds (see valuation code comments)"], ["V-CL ]], "mirror": "3.4"}]}, {"h": "Discussion: what the equilibria mean for theory", "paras": [{"t": "Asymmetric multi-layer platforms behave differently from textbook symmetric oligopoly: Nash equilibrium exists in every bilateral game here, yet none of the 6 games reaches an efficient equilibrium \u2014 the infrastructure game included. Existence theorems transfer; welfare conclusions do not.", "insight": false}, {"t": "Efficient local equilibria coexisting with an inefficient aggregate is the empirical face of second-best economics: with switching costs, markups, and lock-in operating simultaneously, the system can be locally stable and globally wasteful. Policy must therefore target the distortion portfolio (Section 5), not merely 'more competition' in the abstract.", "insight": false}, {"t": "A repeated-game lens qualifies the one-shot result: trigger strategies can sustain cooperation where stage games trap players, so the observed Walled-Garden persistence may partly reflect punishment equilibria rather than stage-game necessity \u2014 see Limitations (9.2) and Future work (9.3).", "insight": false}], "tables": []}]}, {"title": "5.  Welfare, Deadweight Loss and Policy", "blocks": [{"h": "", "paras": [{"t": "Highest net-benefit intervention (base scenario): Combined Intervention \u2014 net benefit $214.2B.", "insight": false}, {"t": "Analytical insights \u2014 policy choice", "insight": false}, {"t": "Why this intervention wins.  Combined Intervention leads on base-scenario net benefit ($214.2B): it recovers $229.2B of deadweight loss (55% of the $416.8B aggregate) at a cost of $15.0B (benefit\u2013cost ratio 15.3). This is notable precisely because it does not target the infrastructure bottleneck head-on \u2014 which invites the committee question of whether the ranking survives under the optimistic/pessimistic scenarios. The policy lesson is proportionality: the cheapest effective remedy dominates because the DWL pool is large relative to any plausible intervention cost.", "insight": true}, {"t": "How decisive the ranking is.  The runner-up (API Interoperability Mandate) trails by $73.4B in net benefit. A wide margin means the recommendation is robust to scenario choice \u2014 check the optimistic/conservative columns to confirm.", "insight": true}, {"t": "Complementarity tested, not assumed.  The combined intervention recovers $229.2B against $418.9B summed standalone (ratio 0.547: sub-additive (overlap/diminishing)). The levers OVERLAP \u2014 the Combined ranking in Exhibit 5.2b wins on absolute net benefit, but stacking all four buys less than the sum of its parts. A committee should ask whether a two- or three-lever bundle dominates the full package. This is the second-best logic of Section 2.3 made quantitative.", "insight": true}], "tables": [{"caption": "Exhibit 5.1  Aggregate welfare (computed by build_technical_report.py)", "cols": ["Metric", "Value"], "rows": [["Observed (Nash) welfare", "$1,034.50B"], ["Potential joint-surplus welfare", "$1,451.27B"], ["Aggregate deadweight loss", "$416.77B"], ["Aggregate efficiency", "71.28%"], ["Market-implied DWL assumption", "28.72%"]]}, {"caption": "Exhibit 5.2  Deadweight-loss decomposition (computed by build_technical_report.py)", "cols": ["Source", "DWL ($B)", "Share (%)"], "rows": [["Coordination Failures", "60.01", "14.4"], ["Monopoly Pricing", "35.86", "8.6"], ["Innovation Distortion", "106.97", "25.7"], ["Quality Degradation", "71.31", "17.1"], ["Switching Costs", "142.62", "34.2"]]}, {"caption": "Exhibit 5.2b  Policy interventions ranked by base-scenario net benefit (ai_ecosystem_model.py enhancement output)", "cols": ["Policy", "DWL reduction ($B)", "Cost ($B)", "Net benefit ($B)", "BCR"], "rows": [["Combined Intervention", "229.2", "15.0", "214.2", "15.3"], ["API Interoperability Mandate", "145.9", "5.0", "140.9", "29.2"], ["Antitrust Enforcement", "104.2", "2.0", "102.2", "52.1"], ["Innovation Subsidies", "93.8", "8.0", "85.8", "11.7"], ["Data Sharing Mandate", " edly, so this exceeds the top-down aggregate by construction; see the discussion below).", "insight": false}, {"t": "Analytical insights \u2014 welfare and deadweight loss", "insight": false}, {"t": "What the deadweight loss is made of.  Switching costs is the single largest component of the $416.8B aggregate DWL (34%). Because the mix differs by source, so does the remedy: a coordination-dominated loss points to interoperability and standard-setting, whereas a switching-cost-dominated loss points to portability mandates. Treating all $416.8B as one 'market failure' number would mislead policy design.", "insight": true}, {"t": "Efficiency gap and the value of coordination.  The system operates at 71.3% of its potential (1,451.3B vs. observed 1,034.5B). Coordination failures total $867.8B gross across the six games \u2014 shared players are counted repeatedly, which is why this exceeds the top-down aggregate. The loss is not an exogenous shock but an equilibrium outcome that cooperation, standard-setting, or mediated bargaining could in principle recover.", "insight": true}], "tables": [{"caption": "Exhibit 5.3  Coordination-failure diagnostics (computed by build_technical_report.py)", "cols": ["Game", "Coordination failure", "Severity", "DWL ($B)", "Efficiency (%)"], "rows": [["Hardware-Cloud Providers", "Yes", "Moderate", "58.59", "94.9"], ["Hardware-Foundation Models", "Yes", "Critical", "205.59", "76.6"], ["Hardware-LLM Wrappers", "Yes", "Critical", "247.04", "71.1"], ["Cloud Providers-Foundation Models", "Yes", "High", "141.24", "81.1"], ["Cloud Providers-LLM Wrappers", "Yes", "Critical", "180.68", "75.1"], ["Foundation Models-LLM Wrappers", "Yes", "High", "34.62", "80.5"]]}, {"caption": "Table", "cols": ["Module", "WelfareEconomicsAnalyzer"], "rows": [["Outputs", "Tables 3.4 (core + aggregate), 5.3 (decomposition); Figure 7 (welfare composite)."], ["Inference", "$416.8B aggregate loss at 71.3% efficiency, led by switching costs ($142.6B)."], ["Implication", "Match remedy to source: switching-cost dominance argues portability mandates; coordination share argues standards and in"]]}, {"caption": "Table 5.3: Welfare Decomposition", "cols": ["Source of Deadweight Loss", "Estimated Contribution ($B)", "Percentage of Total DWL (%)"], "rows": [["Coordination Failures", "60.01", "14.40"], ["Monopoly Pricing", "35.86", "8.60"], ["Innovation Distortion", "106.97", "25.70"], ["Quality Degradation", "71.31", "17.10"], ["Switching Costs", "142.62", "34.20"], ["Total", "416.77", "100"]], "mirror": "5.3"}, {"caption": "Table 5.4: Dynamic Game Analysis (Short vs Long-term)", "cols": ["Player", "Strategy", "Short-term Payoff", "Long-term Payoff", "Difference (L-S)", "Long/Short Ratio (%)", "Time Preference", "Risk Level"], "rows": [["Cloud Providers", "Full Stack", "5", "8", "3", "160", "Long-term", "Medium"], ["Cloud Providers", "Selective Partnership", "3", "4", "1", "133.30", "Long-term", "Low"], ["Cloud Providers", "Infrastructure Only", "2", "2", "0", "100", "Neutral", "Low"], ["Foundation Models", "Compete Direct", "4", "5", "1", "125", "Long-term", "Medium"], ["Foundation Models", "Exclusive Deals", "3", "-2", "-5", "-66.70", "Short-term", "Critical"], ["Foundation Models", "Support Wrappers", "2", "-1", "-3", "-50", "Short-term", "High"], ["Hardware", "Open Access", "6", "9", "3", "150", "Long-term", "Low"], ["Hardware", "Exclusive Deals", "5", "3", "-2", "60", "Short-term", "High"], ["Hardware", "Price Control", "7", "2", "-5", "28.60", "Short-term", "Critical"], ["LLM Wrappers", "Vertical Integration", "2", "6", "4", "300", "Long-term", "High"], ["LLM Wrappers", "Premium Pricing", "1", "3", "2", "300", "Long-term", "Medium"], ["LLM Wrappers", "Subsidize Usage", "-3", "-4", "-1", "133.30", "Short-term", "Critical"]], "mirror": "5.4"}, {"caption": "Table 6.1\u20136.3: Policy Simulation Summary (v4.0)", "cols": ["Policy Scenario", "DWL Reduction ($B)", "Welfare Improvement (%)", "Implementation Cost ($B)", "Net Annual Benefit ($B)" ting the strategic structure right.", "insight": false}, {"t": "Nine coefficients calibrated by coordinate bisection; 2 have interior (two-sided) identified intervals (w_capex, w_hhi) and the rest are open on at least one side. Wide intervals mean the published Nash positions and formation order do not hang on the judgment values; the two-sided intervals mark where re-estimation would matter most.", "insight": false}, {"t": "Analytical insights \u2014 robustness", "insight": false}, {"t": "Equilibria independently cross-validated.  Every reported Nash equilibrium was re-enumerated by an independent brute-force implementation (direct dominance checks, no shared code with the solver): 6/6 positions match, 6/6 counts match. The game solutions are verified, not merely computed.", "insight": true}, {"t": "Simulation converged by the book.  Per-game Monte-Carlo standard errors and split-half consistency were computed from the stored draw distributions: Cloud Providers-Foundation Models=adequate, Cloud Providers-LLM Wrappers=adequate, Foundation Models-LLM Wrappers=adequate, Hardware-Cloud Providers=adequate, Hardware-Foundation Models=adequate, Hardware-LLM Wrappers=adequate. R-hat is deliberately not used \u2014 for IID draws it is ~1 by construction and proves nothing (Vehtari et al. 2021). All games adequate or check-level.", "insight": true}, {"t": "How sensitive the headline loss is.  The sensitivity elasticity is 1.41: a 1% change in the market-implied DWL assumption moves the dollar deadweight loss by about 1.41%. Results of this leverage should be read as orders of magnitude, not decimals \u2014 the directional story (which games fail, which sources dominate) is stable even if the point estimate of $416.8B carries wide uncertainty.", "insight": true}, {"t": "Equilibrium stability under noise.  Across the Monte-Carlo draws the equilibrium reproduces in 64.7% of perturbed payoffs (sensitive to payoff noise). Low stability would signal knife-edge payoffs where small ide the \u00b120% band is not p"]]}]}]}, {"title": "7.  Risk, Stability and Cooperation", "blocks": [{"h": "7.1  Cooperative game: Shapley allocation", "paras": [{"t": "Grand-coalition value $1,344.9B vs. sum of standalone values $1,034.5B \u2192 cooperative surplus $310.4B.", "insight": false}, {"t": "Supplemental S3 \u2014 Shapley Share vs Revenue Share", "insight": false}, {"t": "Analytical insights \u2014 cooperation and bargaining power", "insight": false}, {"t": "Shapley values as bargaining power.  Hardware captures the largest share of cooperative surplus (43.4% of the Shapley allocation) \u2014 about 0.95\u00d7 its revenue share (45.9%). A Shapley share far above size means the player is a bottleneck: others' gains depend on its participation, which is the formal counterpart of the informal 'you need me more than I need you' power the market-structure results implied.", "insight": true}, {"t": "The price of non-cooperation.  Grand-coalition cooperation would create roughly $310B of surplus over standalone play \u2014 the amount the ecosystem leaves on the table by insisting on bilateral, adversarial relationships rather than joint investment.", "insight": true}], "tables": [{"caption": "Exhibit 7.1  Shapley value allocation (computed by build_technical_report.py)", "cols": ["Player category", "Shapley value ($B)", "Share (%)"], "rows": [["Hardware", "583.8", "43.4"], ["Cloud Providers", "520.1", "38.7"], ["Foundation Models", "159.5", "11.9"], ["LLM Wrappers", "81.4", "6.1"]]}, {"caption": "Table 5.4b: Shapley Value Allocation (Cooperative Game)", "cols": ["Player", "Original Value ($B)", "Shapley Value ($B)", "Gain/Loss ($B)", "Share of Total (%)"], "rows": [["Cloud Providers", "417", "520.14", "103.14", "38.70"], ["Foundation Models", "106.50", "159.49", "52.99", "11.90"], ["Hardware", "475", "583.78", "108.78", "43.40"], ["LLM Wrappers", "36", "81.44", "45.44", "6.10"]], "mirror": "5."}, {"caption": "Table 7.18: Shapley Share vs Revenue Share (Bargaining vs Size)", "cols": ["Archetype", "Revenue Share (%)", "Shapley Share (%)", "Gap (pp, Shapley \u2212 Revenue)"], "rows": [["Hardware", "45.90", "43.40", "-2.50"], ["Cloud Providers", "40.30", "38.70", "-1.60"], ["Foundation Models", "10.30", "11.90", "1.60"], ["LLM Wrappers", "3.50", "6.10", "2.60"]], "mirror": "7.18"}, {"caption": "Table", "cols": ["Module", "NetworkRiskAnalysis, PortfolioRiskAnalysis, SuccessProbabilityModel, Cooperative"], "rows": [["Outputs", "Tables 5.4b (Shapley), A.1\u2013A.3 (network/portfolio/success); Figures 14\u201316."], ["Inference", "Hardware takes 43.4% of cooperative surplus on a 45.9% revenue share \u2014 the bottleneck's bargaining power exceeds its siz"], ["Implication", "Bargaining and merger review should price bottleneck participation, and stress tests should shock the central node first"]]}]}, {"h": "7.2  Circular deals", "paras": [{"t": "Analytical insights \u2014 circular deals and systemic fragility", "insight": false}, {"t": "Bubble score and self-referential demand.  The circular-deals bubble score of 0.632 signals material fragility: a meaningful share of demand is circular. Score construction weights concentrated, Critical deals most heavily, so it is best read as a fragility index: how much of today's revenue depends on counterparties paying each other rather than on final customers.", "insight": true}, {"t": "Fragility composite: elevated, and where it comes from.  The five-channel fragility composite is 0.551 (elevated). Its largest channel is Circularity \u2014 so the fragility story is about concentrated circular exposure, consistent with the bubble-score reading above rather than a separate alarm.", "insight": true}, {"t": "A single-point-of-failure fabric.  80% of circular deal value ($953B of $1,188B) touches NVIDIA \u2014 through GPU supply, vendor financing, or equity. Concentration of that kind means a shock to one balance sheet (a demand pause, a financing retrenchment, a chip-design slip) propagates throug
